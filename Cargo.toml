[workspace]
resolver = "2"
members = [
    ".",
    "testlib",
    "ui-tests",
]

[package]
name = "serde_tokenstream"
version = "0.3.0"
edition = "2024"
license = "Apache-2.0"
description = "A serde deserializer for proc_macro::TokenStreams"
repository = "https://github.com/oxidecomputer/serde_tokenstream"
readme = "README.md"
keywords = ["serde", "tokenstream", "proc_macro"]
categories = ["development-tools::procedural-macro-helpers", "parsing"]
rust-version = "1.85"

[package.metadata.release]
pre-release-replacements = [
    { file = "CHANGELOG.md", search = "Unreleased", replace = "[{{version}}]", min = 1 },
    { file = "CHANGELOG.md", search = "ReleaseDate", replace = "{{date}}", min = 1 },
    { file = "CHANGELOG.md", search = "<!-- next-header -->", replace = "<!-- next-header -->\n## Unreleased - ReleaseDate\n", exactly = 1 },
    { file = "CHANGELOG.md", search = "<!-- next-url -->", replace = "<!-- next-url -->\n[{{version}}]: https://github.com/oxidecomputer/serde_tokenstream/releases/tag/v{{version}}", exactly = 1 },
]

[dependencies]
proc-macro2  = "1.0"
quote = "1.0"
serde = { version = "1.0", features = ["derive"] }
syn = { version = "3.0.5", features = ["full"] }
